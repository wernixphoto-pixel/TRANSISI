<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

/* Logo */
#opening{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;

    opacity:0;

    animation:
        fadeIn 1s ease forwards,
        fadeOut 1s ease forwards;

    /* Fade in langsung, fade out setelah tampil 5 detik */
    animation-delay:
        0s,
        4s;
}

@keyframes fadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

@keyframes fadeOut{
    from{
        opacity:1;
    }
    to{
        opacity:0;
    }
}
</style>

</head>
<body>

<img id="opening" src="logo.png" alt="Opening">

</body>
</html>
