<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

/* Logo */
#opening{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain; /* Ganti ke cover jika ingin memenuhi layar */
    opacity:1;

    animation:fadeOut 1s linear forwards;
    animation-delay:6s; /* Tampil 10 detik, lalu mulai fade */
}

@keyframes fadeOut{
    from{
        opacity:1;
    }
    to{
        opacity:0;
    }
}
</style>

</head>
<body>

<img id="opening" src="logo.png" alt="Opening">

</body>
</html>
