<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

#overlay{
    position:fixed;
    inset:0;
    background:#131925;
    opacity:0;
    animation: opening 4.5s linear forwards;
}

@keyframes opening{

    /* Mulai transparan */
    0%{
        opacity:0;
        background:#131925;
    }

    /* Fade in 0,5 detik */
    11.11%{
        opacity:1;
        background:#131925;
    }

    /* Bertahan 2 detik */
    55.56%{
        opacity:1;
        background:#131925;
    }

    /* Gradasi ke hitam selama 1 detik */
    77.78%{
        opacity:1;
        background:#000000;
    }

    /* Fade out 1 detik */
    100%{
        opacity:0;
        background:#000000;
    }

}
</style>

</head>
<body>

<div id="overlay"></div>

</body>
</html>
