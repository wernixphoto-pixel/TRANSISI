<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

#overlay{
    position:fixed;
    inset:0;
    background:#131925;
    opacity:0;
    animation: opening 5s linear forwards;
}

@keyframes opening{

    /* 0 s */
    0%{
        opacity:0;
        background:#131925;
    }

    /* 0,5 s - Fade in selesai */
    10%{
        opacity:1;
        background:#131925;
    }

    /* 2,5 s - Bertahan 2 detik */
    50%{
        opacity:1;
        background:#131925;
    }

    /* 4 s - Transisi warna selesai (1,5 detik) */
    80%{
        opacity:1;
        background:#000000;
    }

    /* 5 s - Fade out selesai */
    100%{
        opacity:0;
        background:rgba(0,0,0,0);
    }

}
</style>

</head>
<body>

<div id="overlay"></div>

</body>
</html>
