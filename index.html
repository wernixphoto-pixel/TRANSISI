<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

#overlay{
    position:fixed;
    inset:0;
    background:#131925;
    opacity:0;

    animation:
        fadeIn 0.5s forwards,
        changeColor 1s 2.5s forwards,
        fadeOut 1s 3.5s forwards;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

@keyframes changeColor{
    from{background:#131925;}
    to{background:#000000;}
}

@keyframes fadeOut{
    from{opacity:1;}
    to{opacity:0;}
}
</style>

</head>
<body>

<div id="overlay"></div>

</body>
</html>
