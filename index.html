<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

/* Latar belakang */
body{
    background:#131925;
    animation:
        bgChange 1.5s linear forwards 2s,
        bgFadeOut 1s ease forwards 3.5s;
}

/* Logo */
#opening{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;

    opacity:0;

    animation:
        logoFadeIn 0.5s ease forwards,
        logoFadeOut 1s ease forwards 3.5s;
}

@keyframes logoFadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

@keyframes logoFadeOut{
    from{opacity:1;}
    to{opacity:0;}
}

@keyframes bgChange{
    from{
        background:#131925;
    }
    to{
        background:#000000;
    }
}

@keyframes bgFadeOut{
    from{
        opacity:1;
    }
    to{
        opacity:0;
    }
}
</style>

</head>
<body>

<img id="opening" src="logo.png" alt="Opening">

</body>
</html>
